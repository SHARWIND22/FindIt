<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FindIt</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at 85% 15%, rgba(242,140,40,0.12), transparent 30%),
                radial-gradient(circle at 15% 75%, rgba(49,94,251,0.15), transparent 35%),
                #081326;
            color: white;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo img {
            width: 65px;
            height: 70px;
            object-fit: contain;
        }

        .logo h1 {
            margin-top: 10px;
            font-size: 28px;
        }

        .logo span {
            color: #f28c28;
        }

        .subtitle {
            text-align: center;
            color: #a8b5ca;
            font-size: 13px;
            margin-top: 8px;
        }

        .lock {
            text-align: center;
            font-size: 35px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #d1d9e8;
            font-size: 13px;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #0b172b;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #f28c28;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg,#f28c28,#ffad59);
            color: #111827;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .flash {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .flash.error {
            background: rgba(220,38,38,0.15);
            color: #fca5a5;
            border: 1px solid #dc2626;
        }

        .flash.success {
            background: rgba(22,163,74,0.15);
            color: #4ade80;
            border: 1px solid #16a34a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #a8b5ca;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #f28c28;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/mite-logo.png') }}"
             alt="MITE Logo">

        <h1>Find<span>It.</span></h1>
        <p class="subtitle">Administrator Access</p>
    </div>

    <div class="lock">🔐</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label for="username">Admin Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required
            autocomplete="username"
        >

        <label for="password">Admin Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            Login as Admin
        </button>

    </form>

    <a href="{{ url_for('matches_page') }}" class="back">
        ← Back to AI Matches
    </a>

</div>

</body>
</html>
