<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claim Item | FindIt</title><style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#38234c,transparent 35%),#081326;color:#f8fafc}
nav{padding:20px 7%;background:#050e1e;border-bottom:1px solid #ffffff20;display:flex;justify-content:space-between}a{color:#ffad59;text-decoration:none}
main{max-width:760px;margin:40px auto;padding:30px;background:#ffffff0b;border:1px solid #ffffff20;border-radius:18px}
h1{margin-top:0}.muted,label{color:#a8b5ca}.muted{line-height:1.6}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}
.field{display:flex;flex-direction:column;gap:8px}.wide{grid-column:1/-1}
input,select,textarea{width:100%;padding:13px;border:1px solid #ffffff25;border-radius:8px;background:#101e34;color:white}
textarea{min-height:110px;resize:vertical}.btn{padding:14px;border:0;border-radius:8px;background:#f28c28;color:#111827;font-weight:bold;cursor:pointer}
.flash{padding:12px;background:#dc262625;color:#fca5a5;border-radius:8px;margin:12px 0}
@media(max-width:600px){main{margin:20px 12px;padding:20px}form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><nav><strong>FindIt.</strong><a href="{{ url_for('item_details', item_id=item.id) }}">← Back to item</a></nav>
<main><h1>Submit a Claim Request</h1><p class="muted">Claiming: <strong>{{ item.item_name }}</strong> · {{ item.location }}</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST">
<div class="field"><label>Full Name *</label><input name="student_name" required maxlength="100" value="{{ request.form.get('student_name','') }}"></div>
<div class="field"><label>USN *</label><input name="student_usn" required maxlength="30" value="{{ request.form.get('student_usn','') }}"></div>
<div class="field"><label>Branch *</label><select name="branch" required><option value="">Select branch</option>{% for b in ['AIML','CSE','ISE','ECE','EEE','ME','CIVIL'] %}<option value="{{ b }}" {% if request.form.get('branch') == b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></div>
<div class="field"><label>Year *</label><select name="year" required><option value="">Select year</option>{% for y in ['1st Year','2nd Year','3rd Year','4th Year'] %}<option value="{{ y }}" {% if request.form.get('year') == y %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></div>
<div class="field"><label>Phone Number *</label><input type="tel" name="phone" required maxlength="20" placeholder="Enter your phone number" pattern="[0-9+() -]{7,20}" value="{{ request.form.get('phone','') }}"></div>
<div class="field"><label>Email Address</label><input type="email" name="email" maxlength="120" placeholder="Enter your email (optional)" value="{{ request.form.get('email','') }}"></div>
<div class="field wide"><label>Proof of ownership *</label><textarea name="ownership_proof" required maxlength="1500" placeholder="Describe unique details only the real owner would know (e.g. scratches, stickers, contents, lock-screen details).">{{ request.form.get('ownership_proof','') }}</textarea></div>
<div class="field wide"><label>Additional message (optional)</label><textarea name="message" maxlength="1000">{{ request.form.get('message','') }}</textarea></div>
<div class="field wide"><button class="btn" type="submit">Send Claim Request</button></div>
</form></main></body></html>
